<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wichteln</title>
<style>
  :root {
    --bg1: #0f2a24; --bg2: #1b3d33; --card: #fffdf9; --ink: #2b2420; --muted: #7a6e66;
    --accent: #b3322b; --gold: #c99a2e; --accent-ink: #fff; --line: #e9dfd2; --soft: #f7f1e8; --err: #a33;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #070f0d; --bg2: #10221d; --card: #1f1c17; --ink: #f1e9df; --muted: #a99e92;
      --accent: #e0564c; --gold: #e2b84f; --line: #3a332a; --soft: #29251f; --err: #f08a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--bg1); }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 28px 16px;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%) no-repeat var(--bg1);
    color: var(--ink); overflow-x: hidden;
    font: 17px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #snow { z-index: 0; } #confetti { z-index: 2; }
  main {
    position: relative; z-index: 1; width: 100%; max-width: 440px; min-width: 0; background: var(--card);
    border-radius: 20px; padding: 30px 24px 26px; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  .star { font-size: 38px; line-height: 1; color: var(--gold); }
  h1 { font-size: 27px; margin: 8px 0 2px; letter-spacing: -.01em; }
  .countdown {
    display: inline-block; max-width: 100%; margin: 6px 0 22px; padding: 6px 14px;
    border-radius: 14px; background: var(--soft); color: var(--muted); font-size: 14px; line-height: 1.45;
  }
  .countdown .t { white-space: nowrap; }
  .countdown b { color: var(--accent); font-variant-numeric: tabular-nums; }
  p.lead { margin: 0 0 22px; color: var(--muted); }
  label { display: block; text-align: left; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--soft); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 12px; font: inherit; font-weight: 600; padding: 12px;
    border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.5em; margin-top: 12px; font-size: 15px; color: var(--err); }

  #result { display: none; text-align: left; }
  .reveal { text-align: center; margin-bottom: 22px; }
  .reveal .hi { color: var(--muted); margin: 0; }
  .reveal .name { font-size: 40px; font-weight: 750; line-height: 1.15; margin: 4px 0 0; color: var(--accent);
    animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); margin: 22px 0 8px; }
  .about { margin: 0; color: var(--ink); }
  ol.ideas { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  ol.ideas li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start;
    background: var(--soft); border-radius: 12px; padding: 12px; }
  ol.ideas .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; }
  ol.ideas strong { display: block; }
  ol.ideas span { color: var(--muted); font-size: 15px; }
  .wish { margin: 0; padding: 16px 18px; border-left: 3px solid var(--gold); background: var(--soft);
    border-radius: 0 12px 12px 0; font-style: italic; }
  .wish-more { width: auto; background: transparent; color: var(--muted); padding: 4px 0; margin-top: 6px;
    font-weight: 500; font-size: 14px; text-decoration: underline; }
  .psst { text-align: center; color: var(--muted); font-size: 14px; margin: 22px 0 0; }
  #again { background: transparent; color: var(--muted); border: 1px solid var(--line); margin-top: 10px; }
</style>
</head>
<body>
<canvas id="snow" class="fx" aria-hidden="true"></canvas>
<canvas id="confetti" class="fx" aria-hidden="true"></canvas>

<main>
  <div class="star" aria-hidden="true">✦</div>
  <h1>Wichteln</h1>
  <div class="countdown" id="countdown" aria-live="off"></div>

  <form id="form" autocomplete="off">
    <p class="lead">Gib deinen persönlichen Code ein, um zu sehen, wen du beschenkst.</p>
    <label for="code">Dein Code</label>
    <input id="code" name="code" placeholder="z. B. wort-wort-wort" autocapitalize="none" spellcheck="false" required>
    <button id="go" type="submit">Auflösen</button>
    <div class="msg" id="msg" role="status"></div>
  </form>

  <section id="result" aria-live="polite">
    <div class="reveal">
      <p class="hi" id="hi"></p>
      <p class="hi">du beschenkst</p>
      <div class="name" id="target"></div>
    </div>

    <h2>Was der Name verrät</h2>
    <p class="about" id="about"></p>

    <h2>Drei Geschenkideen</h2>
    <ol class="ideas" id="ideas"></ol>

    <h2>Dein Weihnachtswunsch</h2>
    <blockquote class="wish" id="wish"></blockquote>
    <button class="wish-more" id="wishMore" type="button">Anderen Wunsch ziehen</button>

    <p class="psst">Psst – nicht verraten! 🤫</p>
    <button id="again" type="button">Schließen</button>
  </section>
</main>

const $ = id => document.getElementById(id);
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Countdown bis Heiligabend ---------- */
function updateCountdown() {
  const now = new Date();
  let y = now.getFullYear();
  const xmas = d => new Date(d, 11, 24, 0, 0, 0);
  const el = $("countdown");
  if (now >= xmas(y) && now < new Date(y, 11, 27)) {
    el.innerHTML = "🎄 <b>Frohe Weihnachten!</b>"; return;
  }
  if (now >= xmas(y)) y++;
  const ms = xmas(y) - now;
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24,
        m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  el.innerHTML = `Noch <span class="t"><b>${d}</b> Tage</span> <span class="t"><b>${h}</b> Std</span> <span class="t"><b>${m}</b> Min</span> <span class="t"><b>${String(s).padStart(2,"0")}</b> Sek</span> <span class="t">bis Heiligabend</span>`;
}
updateCountdown(); setInterval(updateCountdown, 1000);

/* ---------- Schneefall ---------- */
(function snow() {
  const c = $("snow"), x = c.getContext("2d");
  let W, H, flakes = [];
  const resize = () => {
    const dpr = devicePixelRatio || 1;
    W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(140, W * H / 9000));
    flakes = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.4 + .8,
      v: Math.random() * .6 + .3, w: Math.random() * Math.PI * 2
    }));
  };
  resize(); addEventListener("resize", resize);
  const draw = () => {
    x.clearRect(0, 0, W, H); x.fillStyle = "rgba(255,255,255,.85)";
    for (const f of flakes) {
      if (!reduceMotion) {
        f.y += f.v; f.w += .01; f.x += Math.sin(f.w) * .4;
        if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; }
      }
      x.beginPath(); x.arc(f.x, f.y, f.r, 0, Math.PI * 2); x.fill();
    }
    if (!reduceMotion) requestAnimationFrame(draw);
  };
  draw();
})();

/* ---------- Konfetti ---------- */
function confetti() {
  if (reduceMotion) return;
  const c = $("confetti"), x = c.getContext("2d"), dpr = devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const colors = ["#b3322b", "#e0564c", "#c99a2e", "#f2d27a", "#2f7a5a", "#ffffff"];
  const parts = Array.from({ length: 180 }, () => ({
    x: W / 2 + (Math.random() - .5) * 80, y: H * .38,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
    s: Math.random() * 7 + 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
    c: colors[Math.floor(Math.random() * colors.length)], star: Math.random() < .25
  }));
  const t0 = performance.now();
  const step = t => {
    x.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.fillStyle = p.c;
      if (p.star) { x.font = `${p.s * 2.2}px sans-serif`; x.fillText("✦", 0, 0); }
      else x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      x.restore();
    }
    if (t - t0 < 4500) requestAnimationFrame(step); else x.clearRect(0, 0, W, H);
  };
  requestAnimationFrame(step);
}

/* ---------- Entschlüsselung ---------- */
function normalize(s) {
  return s.trim().toLowerCase()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .replace(/[\s_.,]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
}
async function tryEntry(code, e) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b(e.s), iterations: DATA.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  try {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(e.iv) }, key, b(e.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { return null; }
}
async function reveal(raw) {
  const code = normalize(raw);
  const results = await Promise.all(DATA.entries.map(e => tryEntry(code, e)));
  return results.find(Boolean) || null;
}

let lastWish = -1;
function newWish() {
  let i; do { i = Math.floor(Math.random() * WISHES.length); } while (i === lastWish);
  lastWish = i; $("wish").textContent = WISHES[i];
}

function render(r) {
  $("hi").textContent = "Hallo " + r.von + ",";
  $("target").textContent = r.fuer;
  $("about").textContent = r.bedeutung;
  const ol = $("ideas"); ol.replaceChildren();
  r.ideen.forEach(([t, d], i) => {
    const li = document.createElement("li");
    const ico = document.createElement("div"); ico.className = "ico"; ico.textContent = i + 1;
    const txt = document.createElement("div");
    const st = document.createElement("strong"); st.textContent = t;
    const sp = document.createElement("span"); sp.textContent = d;
    txt.append(st, sp); li.append(ico, txt); ol.append(li);
  });
  newWish();
}

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (!window.crypto || !crypto.subtle) {
    $("msg").textContent = "Dein Browser unterstützt das leider nicht. Bitte die Seite über https öffnen.";
    return;
  }
  $("go").disabled = true; $("msg").textContent = ""; $("go").textContent = "Der Wichtel sucht …";
  const r = await reveal($("code").value);
  $("go").disabled = false; $("go").textContent = "Auflösen";
  if (!r) { $("msg").textContent = "Dieser Code passt leider nicht. Bitte nochmal prüfen."; return; }
  render(r);
  $("form").style.display = "none"; $("result").style.display = "block";
  scrollTo({ top: 0 });
  confetti();
});

$("wishMore").addEventListener("click", newWish);

$("again").addEventListener("click", () => {
  $("code").value = "";
  ["hi", "target", "about", "wish"].forEach(id => $(id).textContent = "");
  $("ideas").replaceChildren();
  $("result").style.display = "none"; $("form").style.display = "block";
});
</script>
